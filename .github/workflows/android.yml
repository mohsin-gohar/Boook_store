name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: stable

      - run: flutter pub get
        working-directory: ./bookstore_app

      - run: flutter build apk --release
        working-directory: ./bookstore_app
